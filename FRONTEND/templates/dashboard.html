{% extends "base.html" %}
{% block title %}Dashboard — BankingApp{% endblock %}

{% block content %}
<div class="row mt-4">
  <div class="col-12">
    <h2 class="mb-1">Welcome, {{ username | capitalize }}!</h2>
    <p class="text-muted mb-4">Here is a summary of your account.</p>
  </div>
</div>

<!-- Balance card -->
<div class="row mb-4">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card border-primary">
      <div class="card-body text-center">
        <p class="text-muted small mb-1 text-uppercase tracking-wide">Current Balance</p>
        <h1 class="display-5 fw-bold text-primary mb-0">£{{ balance }}</h1>
      </div>
    </div>
  </div>
</div>

<!-- Action buttons -->
<div class="row g-3">
  <div class="col-auto">
    <a href="{{ url_for('transactions.deposit') }}" class="btn btn-primary btn-lg">
      Deposit Funds
    </a>
  </div>
  <div class="col-auto">
    <a href="{{ url_for('transactions.withdraw') }}" class="btn btn-outline-danger btn-lg">
      Withdraw Funds
    </a>
  </div>
</div>
{% endblock %}
